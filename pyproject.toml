[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "profile-sync"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
    "tabulate>=0.9.0",
]

[project.scripts]
profile-sync = "profile_sync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
